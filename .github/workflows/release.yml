name: Release

# Push a tag like v0.1.0 (e.g. via `npm version patch && git push --follow-tags`)
# to build installers for all platforms and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: RepoRadar v__VERSION__
          releaseBody: |
            ## Download

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon: M1/M2/M3/M4) | `RepoRadar_*_aarch64.dmg` |
            | macOS (Intel) | `RepoRadar_*_x64.dmg` |
            | Windows | `RepoRadar_*_x64-setup.exe` |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            **macOS:** the app is not notarized yet. On first launch, if macOS blocks it, open
            **System Settings → Privacy & Security** and click **Open Anyway**, or run
            `xattr -dr com.apple.quarantine /Applications/RepoRadar.app`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
